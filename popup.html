<!DOCTYPE html>
<html dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تنظیمات AI Commenter</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      width: 300px;
      padding: 15px;
      font-family: Arial, sans-serif;
    }
    
    label {
      display: block;
      margin: 10px 0 5px;
    }
    
    input, select {
      width: 100%;
      padding: 5px;
      margin-bottom: 10px;
    }
    
    button {
      width: 100%;
      padding: 10px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    
    button:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>
  <h3 style="text-align:center">تنظیمات AI Commenter</h3>
  
  <label>سرویس:</label>
  <select id="service">
    <option value="openai">OpenAI</option>
    <option value="ollama">Ollama</option>
  </select>
  
  <label>کلید OpenAI:</label>
  <input type="text" id="openaiKey" placeholder="sk-...">
  
  <label>مدل Ollama:</label>
 <input type="text" id="ollamaModel" value="deepseek-r1:7b" placeholder="deepseek-r1:7b">
  
  <label>Temperature (0-1):</label>
  <input type="number" id="temperature" min="0" max="1" step="0.1" value="0.7">
  
  <button id="saveBtn">ذخیره تنظیمات</button>
  
  <div id="status" style="margin-top:10px; text-align:center;"></div>
  
  <script src="popup.js"></script>
</body>
</html>
